<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    font-family: 'Outfit', sans-serif;
  }

  .og {
    width: 1200px;
    height: 630px;
    background: #1B2A3D;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Left amber sidebar */
  .og::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: #C49A6C;
  }

  .og-main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 80px;
    gap: 0;
  }

  /* Monogram */
  .monogram {
    font-size: 190px;
    line-height: 0.75;
    letter-spacing: -4px;
    white-space: nowrap;
    flex-shrink: 0;
    padding-right: 40px;
  }
  .monogram .n {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    color: #FAF7F2;
  }
  .monogram .s {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    color: #C49A6C;
  }

  /* Vertical divider */
  .divider-line {
    width: 2px;
    align-self: stretch;
    margin: 60px 0;
    background: #C49A6C;
    flex-shrink: 0;
  }

  /* Right content */
  .content {
    padding-left: 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-family: 'Outfit', sans-serif;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.25em;
    color: #C49A6C;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 88px;
    font-weight: 400;
    line-height: 1.05;
    white-space: nowrap;
    margin-bottom: 20px;
  }
  .name .dr { color: #FAF7F2; }
  .name .syed {
    font-style: italic;
    color: #C49A6C;
    margin-left: 12px;
  }

  .rule {
    width: 65px;
    height: 3px;
    background: #C49A6C;
    margin-bottom: 24px;
  }

  .tagline {
    font-family: 'Outfit', sans-serif;
    font-size: 44px;
    font-weight: 600;
    color: #FAF7F2;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .sub {
    font-family: 'Outfit', sans-serif;
    font-size: 30px;
    font-weight: 300;
    color: #E8D5BF;
    line-height: 1.3;
  }

  /* Bottom bar */
  .bottom-bar {
    height: 60px;
    background: #111D2B;
    border-top: 2px solid #C49A6C;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .address {
    font-family: 'Outfit', sans-serif;
    font-size: 19px;
    font-weight: 400;
    color: #C49A6C;
    letter-spacing: 0.02em;
  }

  /* Helper text below the card */
  .instructions {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #666;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og-main">
      <div class="monogram">
        <span class="n">N</span><span class="s">s</span>
      </div>
      <div class="divider-line"></div>
      <div class="content">
        <div class="eyebrow">Whitby Clinic &nbsp;·&nbsp; Durham Region</div>
        <div class="name">
          <span class="dr">Dr. Nihaad</span><span class="syed">Syed</span>
        </div>
        <div class="rule"></div>
        <div class="tagline">Family Doctor in Whitby</div>
        <div class="sub">Now Accepting New Patients</div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="address">200 Brock Street North &nbsp;·&nbsp; Whitby, ON &nbsp;·&nbsp; 905-668-3378</div>
    </div>
  </div>
  <div class="instructions">
    Right-click the card → "Take Screenshot" (Firefox) or use ⌘+Shift+4 on Mac to capture exactly this area
  </div>
</body>
</html>
